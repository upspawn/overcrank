<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scene" width="400" height="240"></canvas>
<script>
  // Pure RAF-driven canvas workload. This is what the in-page canvas
  // capture backend is designed for: the backing store is updated by JS
  // on every RAF tick, no compositor round-trip required.
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let frameIdx = 0;
  function draw(t) {
    frameIdx++;
    // Gradient background that cycles in time
    const hue = Math.round((t / 5) % 360);
    ctx.fillStyle = `hsl(${hue}, 60%, 15%)`;
    ctx.fillRect(0, 0, 400, 240);

    // Moving circle — position depends on virtual time so frames differ
    const cx = 40 + ((t / 10) % 320);
    const cy = 120 + Math.sin(t / 200) * 60;
    ctx.fillStyle = `hsl(${(hue + 180) % 360}, 80%, 60%)`;
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI * 2);
    ctx.fill();

    // Draw the frame index in big text so captures are visibly different
    ctx.fillStyle = 'white';
    ctx.font = 'bold 36px system-ui';
    ctx.fillText(`F${frameIdx}`, 12, 40);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  window.__getFrameIdx = () => frameIdx;
  window.__READY = true;
</script>
</body>
</html>
